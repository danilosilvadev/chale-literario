<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3eee6" />
    <meta name="robots" content="index, follow" />
    <title>Vista sobre Rodas</title>
    <meta name="description" content="Vista sobre Rodas — motorhomes e cabanas sobre rodas." />
    <link rel="canonical" href="https://vistasobrerodas.com.br/" />
    <meta http-equiv="refresh" content="0;url=/chale-literario/" />
    <script>location.replace('/chale-literario/')</script>
    <style>
      :root {
        --bg: #f3eee6;
        --bg-raised: #faf7f2;
        --ink: #2b241e;
        --ink-muted: #4a433c;
        --wood: #7a4e32;
        --line: rgba(43, 36, 30, 0.14);
        --serif: Georgia, "Iowan Old Style", Palatino, serif;
        --sans: "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        padding: 1.5rem;
      }
      .card {
        width: min(28rem, 100%);
        background: var(--bg-raised);
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        padding: 2rem 1.75rem;
        text-align: center;
        box-shadow: 0 18px 50px rgba(62, 42, 28, 0.07);
      }
      .brand {
        font-family: var(--serif);
        font-size: 1.65rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.5rem;
      }
      .brand span { color: var(--wood); }
      p { margin: 0 0 1.25rem; color: var(--ink-muted); line-height: 1.5; }
      a.btn {
        display: inline-block;
        background: var(--wood);
        color: #f7f3ec;
        text-decoration: none;
        padding: 0.85rem 1.35rem;
        border-radius: 999px;
        font-weight: 600;
      }
      a.btn:hover { filter: brightness(1.05); }
      noscript p { margin-top: 1rem; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 class="brand">Vista <span>sobre</span> Rodas</h1>
      <p>Abrindo o anúncio do chalé literário…</p>
      <a class="btn" href="/chale-literario/">Ver o chalé literário</a>
      <noscript>
        <p>Se a página não abrir sozinha, use o botão acima.</p>
      </noscript>
    </main>
  </body>
</html>
